<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Logo/Brand Area -->
  <rect x="50" y="30" width="150" height="40" rx="8" fill="#0ea5e9" opacity="0.2"/>
  
  <!-- Navigation -->
  <rect x="500" y="35" width="60" height="30" rx="6" fill="#e4e4e7" opacity="0.5"/>
  <rect x="570" y="35" width="60" height="30" rx="6" fill="#e4e4e7" opacity="0.5"/>
  <rect x="640" y="35" width="100" height="30" rx="6" fill="#0ea5e9"/>
  
  <!-- Hero Content -->
  <rect x="50" y="120" width="350" height="30" rx="4" fill="#09090b" opacity="0.1"/>
  <rect x="50" y="160" width="300" height="20" rx="4" fill="#09090b" opacity="0.05"/>
  <rect x="50" y="185" width="250" height="20" rx="4" fill="#09090b" opacity="0.05"/>
  
  <!-- CTA Buttons -->
  <rect x="50" y="230" width="120" height="45" rx="8" fill="#0ea5e9"/>
  <rect x="180" y="230" width="120" height="45" rx="8" fill="transparent" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Hero Image -->
  <rect x="450" y="120" width="300" height="200" rx="12" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="550" cy="180" r="30" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="650" cy="220" r="40" fill="#0ea5e9" opacity="0.2"/>
  
  <!-- Title Text -->
  <text x="400" y="380" font-family="Inter, Arial, sans-serif" font-size="32" fill="#0ea5e9" text-anchor="middle" font-weight="bold">Shadcn Theme</text>
  <text x="400" y="395" font-family="Inter, Arial, sans-serif" font-size="14" fill="#52525b" text-anchor="middle">Modern Odoo 18 Theme</text>
</svg>
